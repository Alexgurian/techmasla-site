<style>
:root{--navy:#12283c;--acc:#1f6fce;--line:#d7dee5;--mut:#5d6b7a}
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;color:#1d2733;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5}
.top{background:var(--navy);color:#fff;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.top b{font-size:16px}
.top .tag{color:#8ba3bd;font-size:12px}
.top a{color:#c9d6e4;text-decoration:none;font-size:14px}
.top a:hover{color:#fff}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:19px;color:var(--navy)}
.btn{display:inline-block;background:var(--acc);color:#fff;border:0;padding:10px 18px;border-radius:8px;font-size:14.5px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:#15549f}
.btn2{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn2:hover{background:#eef3f9}
.btn-red{background:#fff;color:#c0392b;border:1px solid #e5b9b3}
.btn-red:hover{background:#fdf1ef}
.btn:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14.5px;vertical-align:middle}
th{color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
.msg{background:#e8f6ee;border:1px solid #b7dfc6;color:#1e6b41;padding:10px 14px;border-radius:8px;margin-bottom:16px}
.err{background:#fdf1ef;border:1px solid #e5b9b3;color:#96271b;padding:10px 14px;border-radius:8px;margin-bottom:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.toolbar button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;font-weight:600;color:var(--navy)}
.toolbar button:hover{background:#eef3f9}
label{display:block;font-weight:700;font-size:13.5px;margin:0 0 6px;color:var(--navy)}
input[type=text],input[type=password]{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:16px}
.row{margin-bottom:14px}
.hint{color:var(--mut);font-size:12.5px;margin:6px 0 0}
.blk{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;background:#eef2f6}
.blk > .blk-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.blk > .blk-head label{margin:0}
.brow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.small{font-size:12px;color:var(--mut)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fdf3e3;color:#9a5b00;border:1px solid #d9a441}
.badge.new{background:#e8f1fd;color:#15549f;border-color:#b9d4f0}
.bframe{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
.dirty-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e67e22;margin-left:6px}
.pickback{position:fixed;inset:0;background:rgba(14,36,56,.55);z-index:9000;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px}
.pickbox{background:#fff;border-radius:12px;max-width:900px;width:100%;padding:18px}
.pickbox h2{margin:0 0 4px;font-size:19px;color:var(--navy)}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pickgrid iframe{width:100%;height:170px;border:1px solid var(--line);border-radius:8px;background:#f4f6f8}
.ptile{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.ptile:hover{border-color:var(--acc);box-shadow:0 6px 18px rgba(18,40,60,.12)}
.ptile .pt-name{font-weight:700;font-size:13.5px;color:var(--navy);margin-top:8px}
.ptile .pt-desc{font-size:12px;color:var(--mut)}
.ptile .tpl-prev{width:100%;height:170px;border:1px solid var(--line);border-radius:8px;background:#f4f6f8}
.ptile[data-tpl="none"] .tpl-prev{border-style:dashed}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login .card{max-width:360px;width:calc(100% - 32px)}
</style>
</head>

  ];

  var TEMPLATES = [{"id": "pod-zakaz", "name": "Поставки под заказ", "desc": "Предложение + этапы + преимущества", "lead": "<p>Привезём оборудование, комплектующие и запчасти из Европы и Азии под задачи вашего производства — с договором, документами и фиксированной стоимостью.<\/p>", "sections": [{"kbg": "hero", "html": "<div class=\"khero\"><svg class=\"khero-ico\"><use href=\"#i-gear\"/><\/svg><div class=\"khero-k\">НАПРАВЛЕНИЕ ПОСТАВОК<\/div><div class=\"khero-t\">Поставки под заказ<\/div><div class=\"khero-l\">Подберём, привезём и оформим — вы получаете готовое решение под ключ.<\/div><\/div>"}, {"kbg": "gray", "html": "<div class=\"cards\"><article class=\"card\"><div class=\"card-ico\"><svg class=\"ico\"><use href=\"#i-gear\"/><\/svg><\/div><h3>Оборудование<\/h3><p>Станки, линии и производственное оборудование под ваш техпроцесс.<\/p><\/article><article class=\"card\"><div class=\"card-ico\"><svg class=\"ico\"><use href=\"#i-package\"/><\/svg><\/div><h3>Комплектующие<\/h3><p>Узлы, детали и расходные материалы, которых нет на российском рынке.<\/p><\/article><article class=\"card\"><div class=\"card-ico\"><svg class=\"ico\"><use href=\"#i-drop\"/><\/svg><\/div><h3>Запчасти<\/h3><p>Оригинальные запчасти к импортному оборудованию по артикулу или образцу.<\/p><\/article><\/div>"}, {"kbg": "white", "html": "<h3>Как проходит поставка<\/h3><ul class=\"checks\"><li>Вы присылаете заявку: описание, артикулы или образец.<\/li><li>Мы проверяем возможность поставки и согласуем цену со сроками.<\/li><li>Заключаем договор с фиксированной стоимостью.<\/li><li>Выкупаем товар, организуем логистику и таможню.<\/li><li>Передаём заказ с полным комплектом документов.<\/li><\/ul>"}, {"kbg": "dark", "html": "<div class=\"stats\"><div class=\"stat\"><b>14<\/b><span>дней — средний срок поставки<\/span><\/div><div class=\"stat\"><b>40+<\/b><span>стран поставки<\/span><\/div><div class=\"stat\"><b>98%<\/b><span>заявок выполняем<\/span><\/div><\/div>"}, {"kbg": "white", "html": "<blockquote class=\"quote\">Каждая поставка — под контролем менеджера: вы всегда знаете, где ваш груз и что происходит дальше.<\/blockquote>"}]}, {"id": "o-kompanii", "name": "О компании", "desc": "История, цифры, преимущества", "lead": "<p>Мультибрендовая компания: официальные поставки, подбор и техническая поддержка предприятий по всей России.<\/p>", "sections": [{"kbg": "hero", "html": "<div class=\"khero\"><svg class=\"khero-ico\"><use href=\"#i-doc\"/><\/svg><div class=\"khero-k\">О НАС<\/div><div class=\"khero-t\">О компании<\/div><div class=\"khero-l\">Команда технических специалистов, которая понимает производство изнутри.<\/div><\/div>"}, {"kbg": "white", "html": "<p>Компания работает с производственными предприятиями, строительными компаниями и сервисными службами: подбираем и поставляем оборудование, комплектующие и расходные материалы, ведём снабжение по графику.<\/p><p>В команде — технические специалисты, которые разбираются не только в бумагах, но и в самом производстве: подскажем аналог, найдём редкую позицию, поможем с выбором.<\/p>"}, {"kbg": "gray", "html": "<div class=\"stats\"><div class=\"stat\"><b>10+<\/b><span>лет на рынке<\/span><\/div><div class=\"stat\"><b>200+<\/b><span>постоянных клиентов<\/span><\/div><div class=\"stat\"><b>5 000+<\/b><span>позиций в поставках<\/span><\/div><div class=\"stat\"><b>40<\/b><span>стран поставки<\/span><\/div><\/div>"}, {"kbg": "white", "html": "<ul class=\"checks\"><li>Официальные договоры и прозрачные цены<\/li><li>Персональный менеджер на каждый объект<\/li><li>Отсрочка платежа для юридических лиц<\/li><li>Доставка по Москве и всей России<\/li><\/ul>"}, {"kbg": "gray", "html": "<blockquote class=\"quote\">Мы предлагаем максимум качества и надёжности — через продукцию и услуги для современного производства.<\/blockquote>"}]}, {"id": "kak-rabotaem", "name": "Как мы работаем", "desc": "Процесс по шагам + таймлайн", "lead": "<p>Прозрачный процесс работы: вы видите каждый этап — от заявки до передачи документов.<\/p>", "sections": [{"kbg": "hero", "html": "<div class=\"khero\"><svg class=\"khero-ico\"><use href=\"#i-arrow\"/><\/svg><div class=\"khero-k\">ПРОЦЕСС<\/div><div class=\"khero-t\">Как мы работаем<\/div><div class=\"khero-l\">Каждый шаг фиксируется — вы всегда знаете статус вашего заказа.<\/div><\/div>"}, {"kbg": "white", "html": "<div class=\"steps\"><div class=\"step\"><div class=\"step-num\">1<\/div><h3>Заявка<\/h3><p>Присылаете перечень или описание задачи — фиксируем требования.<\/p><\/div><div class=\"step-arrow\"><svg class=\"ico\"><use href=\"#i-arrow\"/><\/svg><\/div><div class=\"step\"><div class=\"step-num\">2<\/div><h3>Подбор<\/h3><p>Подбираем позиции, проверяем поставщиков, согласуем цену.<\/p><\/div><div class=\"step-arrow\"><svg class=\"ico\"><use href=\"#i-arrow\"/><\/svg><\/div><div class=\"step\"><div class=\"step-num\">3<\/div><h3>Договор<\/h3><p>Фиксируем стоимость и сроки в договоре.<\/p><\/div><\/div>"}, {"kbg": "gray", "html": "<h3>Что происходит после договора<\/h3><div class=\"timeline\"><div class=\"tl-item\"><b>Выкуп и проверка<\/b><span>Проверяем товар на складе поставщика, делаем фото и видео.<\/span><\/div><div class=\"tl-item\"><b>Логистика<\/b><span>Организуем доставку и таможенное оформление.<\/span><\/div><div class=\"tl-item\"><b>Приёмка<\/b><span>Проверяем комплектность на нашем складе.<\/span><\/div><div class=\"tl-item\"><b>Передача<\/b><span>Отгружаем вам с полным комплектом документов.<\/span><\/div><\/div>"}, {"kbg": "dark", "html": "<div class=\"callout\"><svg class=\"ico\"><use href=\"#i-doc\"/><\/svg><span>На каждом этапе вы получаете фото- и видеоотчёты — вы всегда знаете статус поставки.<\/span><\/div>"}]}, {"id": "katalog", "name": "Каталог направлений", "desc": "Сетка из 6 направлений + список", "lead": "<p>Полная ассортиментная линейка с документами: подберём позиции, аналоги и замены снятых с производства товаров.<\/p>", "sections": [{"kbg": "hero", "html": "<div class=\"khero\"><svg class=\"khero-ico\"><use href=\"#i-package\"/><\/svg><div class=\"khero-k\">АССОРТИМЕНТ<\/div><div class=\"khero-t\">Каталог направлений<\/div><div class=\"khero-l\">Полная линейка продукции с документами и поддержкой подбора.<\/div><\/div>"}, {"kbg": "gray", "html": "<div class=\"cards\"><article class=\"card\"><div class=\"card-ico\"><svg class=\"ico\"><use href=\"#i-gear\"/><\/svg><\/div><h3>Станки и оборудование<\/h3><p>Металло- и деревообработка, ЧПУ, лазеры.<\/p><\/article><article class=\"card\"><div class=\"card-ico\"><svg class=\"ico\"><use href=\"#i-tool\"/><\/svg><\/div><h3>Инструмент<\/h3><p>Ручной, электро- и пневмоинструмент, оснастка.<\/p><\/article><article class=\"card\"><div class=\"card-ico\"><svg class=\"ico\"><use href=\"#i-drop\"/><\/svg><\/div><h3>Смазочные материалы<\/h3><p>Масла, СОЖ, смазки ведущих производителей.<\/p><\/article><article class=\"card\"><div class=\"card-ico\"><svg class=\"ico\"><use href=\"#i-package\"/><\/svg><\/div><h3>Комплектующие<\/h3><p>Узлы, детали и запчасти под заказ.<\/p><\/article><article class=\"card\"><div class=\"card-ico\"><svg class=\"ico\"><use href=\"#i-shield\"/><\/svg><\/div><h3>СИЗ<\/h3><p>Средства индивидуальной защиты оптом.<\/p><\/article><article class=\"card\"><div class=\"card-ico\"><svg class=\"ico\"><use href=\"#i-hammer\"/><\/svg><\/div><h3>Стройматериалы<\/h3><p>Крепёж, метизы, расходники для стройки.<\/p><\/article><\/div>"}, {"kbg": "white", "html": "<h3>Что входит в поставку<\/h3><ul class=\"checks\"><li>Подбор позиций по описанию, артикулу или образцу<\/li><li>Сертификаты и паспорта на всю продукцию<\/li><li>Формирование комплектов под объект или цех<\/li><li>Доставка до склада или объекта<\/li><\/ul>"}]}, {"id": "logistika", "name": "Доставка и логистика", "desc": "Способы доставки + цифры", "lead": "<p>Доставка авиа, авто и морем: подберём маршрут под ваши сроки и бюджет, оформим таможню за вас.<\/p>", "sections": [{"kbg": "hero", "html": "<div class=\"khero\"><svg class=\"khero-ico\"><use href=\"#i-truck\"/><\/svg><div class=\"khero-k\">ЛОГИСТИКА<\/div><div class=\"khero-t\">Доставка и логистика<\/div><div class=\"khero-l\">Маршрут под ваши сроки и бюджет — авиа, авто или море.<\/div><\/div>"}, {"kbg": "white", "html": "<div class=\"steps\"><div class=\"step\"><div class=\"step-num\">1<\/div><h3>Авиа<\/h3><p>Срочные грузы — от 5 дней. Дорого, но максимально быстро.<\/p><\/div><div class=\"step-arrow\"><svg class=\"ico\"><use href=\"#i-arrow\"/><\/svg><\/div><div class=\"step\"><div class=\"step-num\">2<\/div><h3>Авто<\/h3><p>Оптимальный вариант для Европы — 10–20 дней.<\/p><\/div><div class=\"step-arrow\"><svg class=\"ico\"><use href=\"#i-arrow\"/><\/svg><\/div><div class=\"step\"><div class=\"step-num\">3<\/div><h3>Море и жд<\/h3><p>Крупные партии из Китая — 35–60 дней, самая низкая цена за кг.<\/p><\/div><\/div>"}, {"kbg": "gray", "html": "<div class=\"stats\"><div class=\"stat\"><b>35–60<\/b><span>дней доставка из Китая<\/span><\/div><div class=\"stat\"><b>140<\/b><span>стран и портов поставки<\/span><\/div><div class=\"stat\"><b>0 ₽<\/b><span>за расчёт логистики<\/span><\/div><\/div>"}, {"kbg": "white", "html": "<div class=\"callout\"><svg class=\"ico\"><use href=\"#i-doc\"/><\/svg><span>Таможенное оформление, страховка груза и полный пакет документов входят в стоимость.<\/span><\/div>"}]}, {"id": "dokumenty", "name": "Документы и гарантии", "desc": "Документооборот + гарантии", "lead": "<p>Работаем официально: договор, счёт-фактура, паспорта и сертификаты на всю поставляемую продукцию.<\/p>", "sections": [{"kbg": "hero", "html": "<div class=\"khero\"><svg class=\"khero-ico\"><use href=\"#i-check\"/><\/svg><div class=\"khero-k\">ГАРАНТИИ<\/div><div class=\"khero-t\">Документы и гарантии<\/div><div class=\"khero-l\">Официальный договор, полная отчетность и ответственность за результат.<\/div><\/div>"}, {"kbg": "white", "html": "<ul class=\"checks\"><li>Договор поставки с фиксированной ценой и сроками<\/li><li>Паспорта безопасности на всю продукцию<\/li><li>Сертификаты соответствия и отказные письма<\/li><li>Счёт-фактура и УПД для бухгалтерии<\/li><li>Гарантийные обязательства производителей<\/li><\/ul>"}, {"kbg": "gray", "html": "<div class=\"callout\"><svg class=\"ico\"><use href=\"#i-doc\"/><\/svg><span>Работаем с юридическими лицами и ИП. Отсрочка платежа — по договору для постоянных клиентов.<\/span><\/div>"}, {"kbg": "white", "html": "<blockquote class=\"quote\">Все документы готовим заранее — бухгалтерия получает полный пакет вместе с товаром, а не «потом».<\/blockquote>"}]}, {"id": "otrasli", "name": "Отрасли", "desc": "Кому поставляем + примеры", "lead": "<p>Обслуживаем производства, строительные компании, транспорт и пищевую отрасль — подберём решение под вашу отрасль.<\/p>", "sections": [{"kbg": "hero", "html": "<div class=\"khero\"><svg class=\"khero-ico\"><use href=\"#i-globe\"/><\/svg><div class=\"khero-k\">ОТРАСЛИ<\/div><div class=\"khero-t\">Отрасли<\/div><div class=\"khero-l\">Решения для производства, строительства, транспорта и пищевой отрасли.<\/div><\/div>"}, {"kbg": "gray", "html": "<div class=\"cards\"><article class=\"card\"><div class=\"card-ico\"><svg class=\"ico\"><use href=\"#i-gear\"/><\/svg><\/div><h3>Производство<\/h3><p>Снабжение цехов: от СОЖ до запчастей к станкам.<\/p><\/article><article class=\"card\"><div class=\"card-ico\"><svg class=\"ico\"><use href=\"#i-hammer\"/><\/svg><\/div><h3>Строительство<\/h3><p>Крепёж, СИЗ и инструмент по графику работ.<\/p><\/article><article class=\"card\"><div class=\"card-ico\"><svg class=\"ico\"><use href=\"#i-truck\"/><\/svg><\/div><h3>Транспорт<\/h3><p>Масла и запчасти для автопарков предприятий.<\/p><\/article><article class=\"card\"><div class=\"card-ico\"><svg class=\"ico\"><use href=\"#i-shield\"/><\/svg><\/div><h3>Пищевая отрасль<\/h3><p>Смазки с пищевым допуском и моющие средства.<\/p><\/article><\/div>"}, {"kbg": "white", "html": "<h3>Пример из практики<\/h3><p>Для металлообрабатывающего предприятия подобрали и поставили б/у обрабатывающий центр из Европы — на 60% дешевле нового, с пусконаладкой и гарантией. Производство запустили через 6 недель после заявки.<\/p><p>Таких проектов — десятки: от единичных позиций до постоянного снабжения нескольких площадок.<\/p>"}]}, {"id": "faq", "name": "Частые вопросы", "desc": "Аккордеон вопрос-ответ", "lead": "<p>Собрали вопросы, которые чаще всего задают перед первым заказом. Не нашли свой — напишите нам.<\/p>", "sections": [{"kbg": "hero", "html": "<div class=\"khero\"><svg class=\"khero-ico\"><use href=\"#i-check\"/><\/svg><div class=\"khero-k\">ВОПРОСЫ<\/div><div class=\"khero-t\">Частые вопросы<\/div><div class=\"khero-l\">Отвечаем на частые вопросы клиентов — до и после заказа.<\/div><\/div>"}, {"kbg": "white", "html": "<div class=\"faq\"><details open><summary>Вы работаете с юридическими лицами?<\/summary><div class=\"faq-a\">Да, мы работаем только с юрлицами и ИП по договору. Отсрочка платежа — для постоянных клиентов.<\/div><\/details><details><summary>Как быстро вы отвечаете на заявку?<\/summary><div class=\"faq-a\">В рабочий день — в течение 2–3 часов. Сложные позиции проверяем у поставщиков до 24 часов.<\/div><\/details><details><summary>Можно ли заказать одну позицию?<\/summary><div class=\"faq-a\">Да, работаем и с единичными позициями, и с регулярными поставками по графику.<\/div><\/details><details><summary>Какие документы вы предоставляете?<\/summary><div class=\"faq-a\">Договор, счёт-фактуру, УПД, паспорта безопасности и сертификаты соответствия.<\/div><\/details><details><summary>Что с доставкой по России?<\/summary><div class=\"faq-a\">Доставляем по Москве и в любой регион — транспортной компанией или нашим транспортом.<\/div><\/details><details><summary>Даёте ли отсрочку платежа?<\/summary><div class=\"faq-a\">Да, после первых поставок — по договору, обычно до 14–30 дней.<\/div><\/details><\/div>"}, {"kbg": "gray", "html": "<div class=\"callout\"><svg class=\"ico\"><use href=\"#i-doc\"/><\/svg><span>Не нашли ответ? Позвоните: +7 (495) 973-20-44 — департамент продаж.<\/span><\/div>"}]}, {"id": "usloviya", "name": "Условия работы", "desc": "Условия + сравнение в таблице", "lead": "<p>Прозрачные условия для постоянных клиентов: договор, отсрочка, персональный менеджер и резерв позиций под объект.<\/p>", "sections": [{"kbg": "hero", "html": "<div class=\"khero\"><svg class=\"khero-ico\"><use href=\"#i-doc\"/><\/svg><div class=\"khero-k\">УСЛОВИЯ<\/div><div class=\"khero-t\">Условия работы<\/div><div class=\"khero-l\">Прозрачные условия для разовых закупок и постоянных клиентов.<\/div><\/div>"}, {"kbg": "white", "html": "<ul class=\"checks\"><li>Закреплённый менеджер — знает вашу специфику<\/li><li>Резерв позиций под ваши объекты<\/li><li>Отсрочка платежа по договору<\/li><li>Скидки от объёма и регулярности поставок<\/li><\/ul>"}, {"kbg": "gray", "html": "<h3>Разовая закупка или постоянная работа<\/h3><table class=\"ptable\"><tr><th><\/th><th>Разовая закупка<\/th><th>Постоянный клиент<\/th><\/tr><tr><td>Цены<\/td><td>Прайсовые<\/td><td>Скидка от объёма<\/td><\/tr><tr><td>Оплата<\/td><td>По счёту<\/td><td>Отсрочка до 30 дней<\/td><\/tr><tr><td>Резерв товара<\/td><td>—<\/td><td>Под объект<\/td><\/tr><tr><td>Менеджер<\/td><td>Общий<\/td><td>Закреплённый<\/td><\/tr><\/table>"}, {"kbg": "white", "html": "<p>Пришлите заявку или спецификацию — подготовим коммерческое предложение с ценами и сроками в течение рабочего дня.<\/p>"}]}, {"id": "zayavka", "name": "Оформление заявки", "desc": "Как отправить заявку + вехи", "lead": "<p>Отправьте заявку — подготовим предложение с ценами и сроками. Это бесплатно и ни к чему не обязывает.<\/p>", "sections": [{"kbg": "hero", "html": "<div class=\"khero\"><svg class=\"khero-ico\"><use href=\"#i-send\"/><\/svg><div class=\"khero-k\">ЗАЯВКА<\/div><div class=\"khero-t\">Оформление заявки<\/div><div class=\"khero-l\">Бесплатный расчёт в течение рабочего дня — без обязательств.<\/div><\/div>"}, {"kbg": "white", "html": "<h3>Что можно указать в заявке<\/h3><ul class=\"checks\"><li>Артикулы, названия или фото продукции<\/li><li>Описание задачи — подберём сами<\/li><li>Объём и сроки, которые важны<\/li><\/ul>"}, {"kbg": "gray", "html": "<div class=\"timeline\"><div class=\"tl-item\"><b>Заявка<\/b><span>Отправляете на почту или звоните<\/span><\/div><div class=\"tl-item\"><b>Расчёт<\/b><span>В течение рабочего дня — цены и сроки<\/span><\/div><div class=\"tl-item\"><b>Договор<\/b><span>Фиксируем условия и начинаем поставку<\/span><\/div><\/div>"}, {"kbg": "dark", "html": "<div class=\"callout\"><svg class=\"ico\"><use href=\"#i-mail\"/><\/svg><span>Почта для заявок: info@techmasla.ru · Телефон: +7 (495) 973-20-44<\/span><\/div>"}]}];

  var SNAP = {"index.html": {"title": "ООО «Индустриальные ТехМасла» — <span>мультибрендовая компания<\/span>", "blocks": {"lead": "<p>Официальный поставщик смазочных материалов BP, Castrol (Optimol, bp, Tribol, Molub-Alloy, Brayco, Braycote) и Rhenus.<\/p>", "about": "\n          <p>Компания предлагает совокупность эффективных решений в области поставок и реализации смазочных материалов по всей ассортиментной линейке. Оказываем услуги по подбору смазочных материалов, которые позволяют адаптировать технологические процессы, касающиеся обработки металлов резанием и давлением, к современным требованиям по безопасности, надежности и эффективности производства.<\/p>\n          <p>В компании работают высококвалифицированные технические специалисты, способные конструктивно решить различные технологические задачи на производстве. В особых случаях компанию консультируют технические специалисты от компаний-производитей, которые дают рекомендации по решению сложных технологических задач, основываясь на передовой опыт.<\/p>\n          <p>Мы предлагаем высокачественную продукцию на российский рынок по разумным ценам.<\/p>\n        "}}, "bu-stanki-iz-evropy.html": {"title": "БУ станки из Европы", "blocks": {"lead": "<p>Б/у станки из Европы с проверенной историей эксплуатации: цена в 2–3 раза ниже нового оборудования при сопоставимом ресурсе.<\/p>", "about": "<p>Подбираем и поставляем б/у станки из Европы для металлообрабатывающих производств: токарные, фрезерные, шлифовальные и расточные станки, вертикальные обрабатывающие центры, листогибочное и гибочное оборудование. Каждое предложение проверяем перед покупкой: состояние узлов и геометрии, наработку, комплектность, документы и историю эксплуатации.<\/p>\n        <p>Работаем напрямую с дилерами и производствами в Германии, Италии, Чехии и других странах Европы, поэтому предлагаем честные цены без лишних посредников. Перед покупкой вы получаете фото, видео и технический отчёт по станку — вы видите, за что платите.<\/p>\n        <ul>\n          <li>Цена в 2–3 раза ниже нового станка при сопоставимом ресурсе<\/li>\n          <li>Проверка оборудования перед покупкой: отчёт, фото, видео<\/li>\n          <li>Подбор под ваш техпроцесс и бюджет за 3–5 рабочих дней<\/li>\n          <li>Доставка и таможенное оформление до вашего производства<\/li>\n          <li>Помощь с пусконаладкой и подбором запасных частей<\/li>\n        <\/ul>\n        <p>Отправьте заявку с параметрами оборудования — подберём варианты под ваш бюджет, рассчитаем стоимость «под ключ» и согласуем сроки поставки.<\/p>", "cta": "<p>За более подробной информацией, а так же за технической поддержкой обращайтесь к нашим специалистам.<\/p>"}}, "instrumenty-iz-evropy.html": {"title": "Инструменты из Европы", "blocks": {"lead": "<p>Профессиональные инструменты из Европы для производства, строительства и сервиса — оригинальная продукция с сертификатами и оптовыми ценами.<\/p>", "about": "<p>Поставляем профессиональные инструменты из Европы для производственных предприятий, строительных компаний и сервисных служб: ручной и электроинструмент, пневмоинструмент, измерительное оборудование, режущий инструмент и оснастка.<\/p>\n        <p>В ассортименте — продукция ведущих европейских производителей. Вся продукция оригинальная, с сертификатами соответствия и паспортами. Подбираем аналоги под ваши задачи и объёмы, отгружаем от небольших партий до регулярных поставок по графику.<\/p>\n        <ul>\n          <li>Оригинальная продукция с сертификатами соответствия<\/li>\n          <li>Оптовые цены и персональные условия для постоянных клиентов<\/li>\n          <li>Подбор аналогов и замены снятых с производства позиций<\/li>\n          <li>Доставка по Москве и всей России<\/li>\n          <li>Отсрочка платежа для юридических лиц по договору<\/li>\n        <\/ul>\n        <p>Пришлите спецификацию или перечень позиций — рассчитаем цены и сроки поставки в течение одного рабочего дня.<\/p>", "cta": "<p>За более подробной информацией, а так же за технической поддержкой обращайтесь к нашим специалистам.<\/p>"}}, "tovary-iz-evropy-pod-zakaz.html": {"title": "Товары из Европы под заказ", "blocks": {"lead": "<p>Привезём из Европы под заказ оборудование, комплектующие и товары, которых нет на российском рынке, — с прозрачной стоимостью и полным комплектом документов.<\/p>", "about": "<p>Привозим из Европы под заказ то, чего нет на российском рынке: оборудование, комплектующие, запчасти и товары для производства. Работаем с юридическими лицами по прозрачной схеме — вы знаете стоимость и сроки до начала сделки.<\/p>\n        <p>Как проходит поставка: вы отправляете заявку с описанием или артикулами, мы проверяем возможность поставки, согласовываем цену и сроки, заключаем договор, выкупаем товар и организуем доставку до вашего склада с полным комплектом документов.<\/p>\n        <ul>\n          <li>Поставка единичных позиций и регулярных партий<\/li>\n          <li>Прозрачная стоимость: комиссия и логистика фиксируются в договоре<\/li>\n          <li>Проверка поставщиков перед выкупом<\/li>\n          <li>Фото- и видеоотчёты на каждом этапе<\/li>\n          <li>Доставка авиа, авто и морем<\/li>\n        <\/ul>\n        <p>Опишите, что нужно привезти, — оценим возможность и сроки поставки бесплатно.<\/p>", "cta": "<p>За более подробной информацией, а так же за технической поддержкой обращайтесь к нашим специалистам.<\/p>"}}, "instrument-i-stanki-iz-kitaya.html": {"title": "Инструмент и станки из Китая", "blocks": {"lead": "<p>Станки и инструмент из Китая напрямую с заводов-производителей: ниже аналогов по цене, с контролем качества, гарантией и запчастями.<\/p>", "about": "<p>Поставляем станки и инструмент из Китая напрямую с заводов-производителей: ЧПУ-станки, лазерное и плазменное оборудование, токарные и фрезерные станки, электро- и ручной инструмент для металло- и деревообработки.<\/p>\n        <p>Отбираем проверенные заводы и контролируем качество до отгрузки: приёмка, тестовый прогон, проверка комплектации и упаковки. За счёт прямых контрактов цена ниже, чем у европейских аналогов, а окупаемость оборудования — от нескольких месяцев.<\/p>\n        <ul>\n          <li>Цена ниже европейских аналогов на 30–50%<\/li>\n          <li>Контроль оборудования перед отгрузкой с фото- и видеоотчётом<\/li>\n          <li>Гарантия и подбор запасных частей<\/li>\n          <li>Доставка морем, авто или жд — 35–60 дней<\/li>\n          <li>Помощь с пусконаладкой и обучением персонала<\/li>\n        <\/ul>\n        <p>Отправьте технические требования — подберём модель под задачу и бюджет, рассчитаем полную стоимость с доставкой.<\/p>", "cta": "<p>За более подробной информацией, а так же за технической поддержкой обращайтесь к нашим специалистам.<\/p>"}}, "tovary-dlya-stroitelstva.html": {"title": "Товары для строительства", "blocks": {"lead": "<p>Товары для строительства оптом для строительных компаний и подрядчиков: крепёж, СИЗ, инструмент и расходники с доставкой по России.<\/p>", "about": "<p>Поставляем товары для строительства оптом: крепёж и метизы, средства индивидуальной защиты, строительный инструмент, расходные материалы и оснастку для строительных компаний, подрядчиков и снабженцев.<\/p>\n        <p>Работаем как с постоянными позициями на складе, так и с поставками под заказ. Снабжение объектов ведём по графику, чтобы материалы приходили на объект точно к нужному этапу работ.<\/p>\n        <ul>\n          <li>Оптовые цены и скидки постоянным клиентам<\/li>\n          <li>Отгрузка от одной паллеты, доставка по Москве и России<\/li>\n          <li>Весь ассортимент с сертификатами и паспортами<\/li>\n          <li>Снабжение объектов по графику работ<\/li>\n          <li>Персональный менеджер и резерв позиций под объект<\/li>\n        <\/ul>\n        <p>Пришлите заявку или спецификацию объекта — подготовим коммерческое предложение с ценами и сроками.<\/p>", "cta": "<p>За более подробной информацией, а так же за технической поддержкой обращайтесь к нашим специалистам.<\/p>"}}};

  function realPages() {

  function kbgOf(html) {
    var m = /^<!--kbg:([a-z]+)-->/.exec(html || '');
    return m ? m[1] : 'white';
  }
  function getBlocks(page) {
    var slug = page.replace(/\.html$/, '');
    var isVirt = !!jget('virtual', {})[slug];
    var ovr = jget('ovr', {})[page] || {};
    var d = jget('draft', {})[page] || {};
    var out = [];
    if (isVirt) {
      var v = jget('virtual', {})[slug];
      out.push({ id: 'lead', val: Object.prototype.hasOwnProperty.call(d, 'lead') ? d.lead : (Object.prototype.hasOwnProperty.call(ovr, 'lead') ? ovr.lead : (v.lead || '')), status: Object.prototype.hasOwnProperty.call(d, 'lead') ? 'draft' : (Object.prototype.hasOwnProperty.call(ovr, 'lead') ? 'pub' : 'orig'), kbg: 'white', alt: false });
      (v.sections || []).forEach(function (s, i) {
        var val = Object.prototype.hasOwnProperty.call(d, s.id) ? d[s.id] : (Object.prototype.hasOwnProperty.call(ovr, s.id) ? ovr[s.id] : s.html);
        var kg = kbgOf(val);
        if (s.kbg === 'hero') kg = 'hero';
        out.push({ id: s.id, val: val, status: Object.prototype.hasOwnProperty.call(d, s.id) ? 'draft' : (Object.prototype.hasOwnProperty.call(ovr, s.id) ? 'pub' : 'orig'), kbg: kg, alt: kg === 'gray' || kg === 'dark' || kg === 'hero', secIndex: i });
      });
      return out;
    }
    var r = ((jget('reg', {})[page] || SNAP[page] || {}).blocks) || {};
    var order = jget('order', {})[page] || [];
    var ids = Object.keys(r);
    Object.keys(ovr).concat(Object.keys(d)).filter(function (i) { return /^block-/.test(i); })
      .sort().forEach(function (i) { if (ids.indexOf(i) < 0) ids.push(i); });
    var ordered = order.filter(function (i) { return ids.indexOf(i) >= 0; });
    ids.forEach(function (i) { if (ordered.indexOf(i) < 0) ordered.push(i); });
    ordered.forEach(function (id) {
      var val, status;
      if (Object.prototype.hasOwnProperty.call(d, id)) { val = d[id]; status = Object.prototype.hasOwnProperty.call(ovr, id) ? 'draft' : 'new'; }
      else if (Object.prototype.hasOwnProperty.call(ovr, id)) { val = ovr[id]; status = 'pub'; }
      else { val = r[id] || ''; status = 'orig'; }
      out.push({ id: id, val: val, status: status, kbg: kbgOf(val), alt: /^block-/.test(id) });
    });
    return out;
  }

  function loginHtml() {
    return '<div class="login"><div class="card"><h2 style="margin:0 0 6px;font-size:22px;color:var(--navy)">Редактор сайта</h2>' +
      '<p style="color:var(--mut);font-size:14px;margin:0 0 18px">Локальный режим. Введите код доступа</p>' +
      '<div id="lg-err"></div>' +
      '<input type="password" id="lg-code" autocomplete="off" style="margin-bottom:14px">' +
      '<button class="btn" id="lg-btn" style="width:100%">Войти</button></div></div>';
  }
  function bindLogin() {
    function tryLogin() {
      var v = document.getElementById('lg-code').value || '';
      crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(function (h) {
        var hex = Array.prototype.map.call(new Uint8Array(h), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
        if (hex === KHASH) { sessionStorage.setItem('kAuth', '1'); state.msg = ''; render(); }
        else { document.getElementById('lg-err').innerHTML = '<p style="color:#96271b;font-size:13px;margin:0 0 10px">Неверный код</p>'; }
      });
    }
    document.getElementById('lg-btn').addEventListener('click', tryLogin);
    document.getElementById('lg-code').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryLogin(); });
    document.getElementById('lg-code').focus();
  }

    function showImgPanel(idx, img) {
      curImg = { frame: idx, img: img };

      var panel = document.getElementById('imgpanel-' + idx);

    function wireFrame(f, b, idx) {
      var tryWire = function () {
        var doc = f.contentDocument;
        var cont = doc && doc.querySelector('.container');
        if (!cont) { setTimeout(tryWire, 60); return; }
        if (doc.__kwired) return;
        doc.__kwired = true;
        cont.addEventListener('input', function () {
          var draft = jget('draft', {});
          draft[page] = draft[page] || {};
          draft[page][b.id] = kbgPrefix(b.kbg) + cont.innerHTML;
          jset('draft', draft);
          updateDirty();
          fit(f);
        });
        cont.addEventListener('paste', function (e) {
          e.preventDefault();
          var t = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
          if (!t) return;
          t = t.replace(/\r/g, '');
          var parts = t.split(/\n{2,}/).filter(function (s) { return s.trim() !== ''; });
          var html = parts.map(function (s) {
            var x = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return '<p>' + x.replace(/\n/g, '<br>') + '</p>';
          }).join('');
          doc.execCommand('insertHTML', false, html);
          cont.dispatchEvent(new Event('input', { bubbles: true }));
        });
        doc.addEventListener('focusin', function () { frames[idx] = f; });
        doc.addEventListener('click', function (e) {
          var img = e.target && e.target.closest && e.target.closest('img');

        doc.addEventListener('dragstart', function (e) {
          var img = e.target && e.target.closest && e.target.closest('img');
          if (!img) return;
          window.__kdrag = img;
          try {
            e.dataTransfer.setData('text/plain', 'k-img');
            e.dataTransfer.effectAllowed = 'move';
          } catch (err) {}
        });
        doc.addEventListener('dragover', function (e) {
          if (window.__kdrag) e.preventDefault();
        });
        doc.addEventListener('drop', function (e) {
          if (!window.__kdrag) return;
          e.preventDefault();
          var img = window.__kdrag;
          window.__kdrag = null;
          var range = null;
          if (doc.caretRangeFromPoint) range = doc.caretRangeFromPoint(e.clientX, e.clientY);
          else if (doc.caretPositionFromPoint) {
            var p = doc.caretPositionFromPoint(e.clientX, e.clientY);
            range = doc.createRange();
            range.setStart(p.offsetNode, p.offset);
          }
          if (range) {
            range.insertNode(img);
            cont.dispatchEvent(new Event('input', { bubbles: true }));
            fit(f);
          }
        });
        fit(f);

      f.addEventListener('load', function () { setTimeout(tryWire, 30); });

    document.querySelectorAll('[data-delblk]').forEach(function (b) {

    document.querySelectorAll('[data-mv]').forEach(function (b) {

        var i = -1;
        for (var q = 0; q < movable.length; q++) if (movable[q].id === id) { i = q; break; }
        if (i < 0) return;
        if (dir === 'up' && i === 0) return;
        if (dir === 'down' && i === movable.length - 1) return;

  function pickImage(cb) {
    var fi = document.getElementById('k-imgfile') || (function () {
      var i = document.createElement('input');
      i.type = 'file'; i.id = 'k-imgfile'; i.accept = 'image/*'; i.style.display = 'none';
      document.body.appendChild(i); return i;
    })();
    fi.onchange = function () {
      var file = fi.files && fi.files[0];
      if (!file) return;
      compressImage(file, 1400, 0.82).then(function (dataUrl) {
        cb(dataUrl);
        fi.value = '';
      }).catch(function () {
        var fr = new FileReader();
        fr.onload = function () { cb(fr.result); fi.value = ''; };
        fr.readAsDataURL(file);
      });
    };
    fi.click();
  }

  function compressImage(file, maxSide, quality) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        URL.revokeObjectURL(url);
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxSide / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * scale);
        c.height = Math.round(h * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var out = c.toDataURL('image/jpeg', quality);
        if (out.length > 900000) {
          c2 = document.createElement('canvas');
          c2.width = Math.round(c.width * 0.7);
          c2.height = Math.round(c.height * 0.7);
          c2.getContext('2d').drawImage(img, 0, 0, c2.width, c2.height);
          out = c2.toDataURL('image/jpeg', 0.72);
        }
        resolve(out);
      };
      img.onerror = reject;
      img.src = url;
    });
  }

      '<div class="pickgrid" id="pick-grid"></div>' +
      '<div class="brow" style="margin-top:14px"><button type="button" class="btn btn2" id="pick-close">Отмена</button></div></div>';
    document.body.appendChild(back);
    var grid = back.querySelector('#pick-grid');
    function fillBlocks() {
      grid.innerHTML = '';
      SKELETONS.forEach(function (s) {
        var t = document.createElement('div');

          '<div class="pt-name">' + esc(s.name) + '</div><div class="pt-desc">' + esc(s.desc) + '</div>';
        t.addEventListener('click', function () {
          insertDraftBlock(s.id, s.html, s.alt);

    }
    function fillTmpls() {
      grid.innerHTML = '';
      TEMPLATES.forEach(function (t) {
        var t2 = document.createElement('div');
        t2.className = 'ptile';
        var inner = t.sections.map(function (s) {
          var cls = 'section' + (s.kbg === 'gray' ? ' section-alt' : '') + ((s.kbg === 'dark' || s.kbg === 'hero') ? ' section-dark' : '');
          return '<section class="' + cls + '"><div class="container" style="padding:14px 18px">' + (s.kbg === 'hero' ? stripKbg(s.html) : s.html) + '</div></section>';
        }).join('');
        t2.innerHTML = '<iframe srcdoc="' + esc('<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><style>body{margin:0;background:#f4f6f8}</style></head><body>' + inner + '</body></html>') + '"></iframe>' +
          '<div class="pt-name">Шаблон: ' + esc(t.name) + '</div><div class="pt-desc">Добавит ' + t.sections.length + ' секций (без бункера)</div>';
        t2.addEventListener('click', function () {
          var page = state.page;
          var draft = jget('draft', {});
          draft[page] = draft[page] || {};
          var ts = Date.now();
          t.sections.forEach(function (s, i) {
            draft[page]['block-' + ts + '-' + i] = kbgPrefix(s.kbg === 'hero' ? 'dark' : s.kbg) + s.html;
          });
          jset('draft', draft);
          state.msg = 'Секции шаблона «' + t.name + '» добавлены в черновик — нажмите «Опубликовать».';
          back.remove();
          render();
        });
        grid.appendChild(t2);
      });
      wireTiles();
    }
    function wireTiles() {
      grid.querySelectorAll('iframe').forEach(function (f) {
        f.addEventListener('load', function () {
          var d = f.contentDocument;
          if (d) d.body.style.pointerEvents = 'none';
        });
      });
    }
    back.querySelectorAll('[data-tab]').forEach(function (b) {
      b.addEventListener('click', function () {
        back.querySelectorAll('[data-tab]').forEach(function (x) { x.className = (x === b) ? 'btn' : 'btn btn2'; });
        if (b.getAttribute('data-tab') === 'blocks') fillBlocks(); else fillTmpls();
      });
    });
    fillBlocks();
    back.querySelector('#pick-close').addEventListener('click', function () { back.remove(); });
    back.addEventListener('click', function (e) { if (e.target === back) back.remove(); });
  }

  function insertDraftBlock(typeId, html, alt) {
    var page = state.page;
    var ovr = jget('ovr', {}), draft = jget('draft', {});
    var merged = Object.assign({}, ovr[page] || {}, draft[page] || {});
    var ts = Date.now();
    var id = 'block-' + ts;
    while (merged[id]) { id = 'block-' + (ts++) + '-1'; }
    draft[page] = draft[page] || {};
    draft[page][id] = kbgPrefix(alt ? 'gray' : 'white') + html;
    jset('draft', draft);
    state.msg = 'Блок добавлен в черновик. Отредактируйте его ниже и нажмите «Опубликовать».';
    render();
  }

  function bindNew() {
    var btn = document.getElementById('np-btn');
    if (!btn) return;
    var grid = document.getElementById('tpl-grid');
    if (grid) {
      grid.querySelectorAll('.ptile').forEach(function (x) {
        x.addEventListener('click', function () {
          document.getElementById('np-tpl').value = x.getAttribute('data-tpl') || '';
          grid.querySelectorAll('.ptile').forEach(function (y) { y.style.outline = (y === x) ? '3px solid var(--acc)' : ''; });
        });
      });
      grid.querySelectorAll('[data-see]').forEach(function (b) {
        b.addEventListener('click', function (e) { e.stopPropagation(); openTplPreview(b.getAttribute('data-see')); });
      });
      grid.querySelectorAll('[data-use]').forEach(function (b) {
        b.addEventListener('click', function (e) {
          e.stopPropagation();
          document.getElementById('np-tpl').value = b.getAttribute('data-use');
          grid.querySelectorAll('.ptile').forEach(function (y) { y.style.outline = (y.getAttribute('data-tpl') === b.getAttribute('data-use')) ? '3px solid var(--acc)' : ''; });
        });
      });
      grid.querySelectorAll('.tpl-prev').forEach(function (f) {
        f.addEventListener('load', function () { try { var d = f.contentDocument; if (d && d.body) { d.body.style.pointerEvents = 'none'; } } catch (e) {} });
      });
    }
    btn.addEventListener('click', function () {
      var title = (document.getElementById('np-title').value || '').trim();
      var slug = (document.getElementById('np-slug').value || '').trim().toLowerCase();
      var tplId = document.getElementById('np-tpl').value || '';
      if (!title) { alert('Введите заголовок страницы'); return; }
      if (!/^[a-z0-9][a-z0-9-]{1,49}$/.test(slug)) { alert('Адрес: только латинские буквы, цифры и дефис'); return; }
      var virt = jget('virtual', {});
      if (virt[slug]) { alert('Страница с таким адресом уже есть'); return; }
      var tpl = TEMPLATES.find(function (x) { return x.id === tplId; });
      if (tpl) {
        var ts = Date.now();
        virt[slug] = { title: title, lead: tpl.lead, sections: tpl.sections.map(function (s, i) {
          return { id: 'sec-' + ts + '-' + i, kbg: s.kbg, html: s.html };
        }) };
      } else {
        virt[slug] = { title: title, lead: '', sections: [{ id: 'sec-' + Date.now(), kbg: 'white', html: '<p>Текст страницы…</p>' }] };
      }
      if (jset('virtual', virt)) {
        state.view = 'panel'; state.msg = 'Страница создана по шаблону «' + (tpl ? tpl.name : 'Без шаблона') + '». Откройте её с диска — уже в меню.';
        render();
      }
    });
  }

  render();
})();
</script>
</body>
</html>
