<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Вход в редактор — ООО "Индустриальные ТехМасла"</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%231f6fce' d='M12 2.7l5.66 5.66a8 8 0 1 1-11.31 0z'/%3E%3C/svg%3E">
<style>
:root{--navy:#12283c;--acc:#1f6fce;--line:#d7dee5;--mut:#5d6b7a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0e2438,#1b3a57 55%,#274b6d);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:20px}
.card{background:#fff;border-radius:14px;padding:36px 32px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo-ico{width:44px;height:44px;flex:none}
.brand-t{font-size:14px;font-weight:800;letter-spacing:.05em;color:var(--navy);text-transform:uppercase;line-height:1.3}
.brand-t small{display:block;font-size:11px;font-weight:600;color:var(--mut)}
h1{margin:0 0 6px;font-size:22px;color:var(--navy)}
.sub{margin:0 0 20px;color:var(--mut);font-size:14px}
label{display:block;font-weight:700;font-size:13px;margin:0 0 6px;color:var(--navy)}
input[type=password]{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:8px;font-size:16px;margin-bottom:14px;outline:none}
input[type=password]:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(31,111,206,.12)}
button{width:100%;padding:13px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-size:15.5px;font-weight:700;cursor:pointer}
button:hover{background:#15549f}
.e{color:#c0392b;font-size:13px;margin:0 0 12px;display:none}
.e.show{display:block}
.back{display:block;text-align:center;margin-top:16px;color:var(--mut);font-size:13px;text-decoration:none}
.back:hover{color:var(--acc)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg class="logo-ico" viewBox="0 0 40 40"><rect width="40" height="40" rx="8" fill="#1f6fce"/><path d="M20 8l8.5 8.5a12 12 0 1 1-17 0z" fill="none" stroke="#fff" stroke-width="2.4"/></svg>
    <div class="brand-t">ООО "Индустриальные<br>ТехМасла" <small>techmasla.ru</small></div>
  </div>
  <h1>Вход в редактор</h1>
  <p class="sub">Введите код доступа. На сервере правки меняют файлы, в облачном режиме — сохраняются в этом браузере.</p>
  <p class="e" id="err">Неверный код. Попробуйте ещё раз.</p>
  <label for="code">Код доступа</label>
  <input type="password" id="code" autocomplete="off" autofocus placeholder="••••••••">
  <button type="button" id="go">Войти</button>
  <a class="back" href="index.html">← Вернуться на сайт</a>
</div>
<script>
(function () {
  var KHASH = 'df2b5bf06672798a084ff726ca513d88cad081536bc5bf6d0d83b44a586dde75';
  function sha(v) {
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(function (h) {
        return Array.prototype.map.call(new Uint8Array(h), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
      });
    }
    return Promise.reject(new Error('no-subtle'));
  }
  function tryGo() {
    var v = document.getElementById('code').value || '';
    sha(v).then(function (hex) {
      if (hex === KHASH) {
        try { sessionStorage.setItem('kAuth', '1'); } catch (e) {}
        location.href = 'admin-local.html';
      } else {
        var e = document.getElementById('err');
        e.classList.add('show');
        document.getElementById('code').select();
      }
    }).catch(function () {
      var e = document.getElementById('err');
      e.textContent = 'Браузер устарел — обновите его (Chrome, Яндекс, Firefox).';
      e.classList.add('show');
    });
  }
  document.getElementById('go').addEventListener('click', tryGo);
  document.getElementById('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryGo(); });
})();
</script>
</body>
</html>
